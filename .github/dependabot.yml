version: 2
updates:
  # Git submodule pointers that pin the child repositories.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    groups:
      git-submodules:
        patterns:
          - "*"

  # GitHub Actions used by the workspace validation workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
